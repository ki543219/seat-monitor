<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seat Monitor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f4f6f5; --surface:#ffffff; --ink:#16201b; --ink-2:#47534d; --muted:#7a8580; --line:#e2e7e4;
  --occupied:#1f7a55; --occupied-tint:#e5f2eb;
  --away:#dd8530;     --away-stripe:#e9a768; --away-tint:#fbefe2;
  --empty:#c8cecb;    --empty-tint:#eef1ef;
  --alert:#b3261e;    --alert-tint:#fdecea;
  --h0:#e9eeeb; --h1:#c3e3d1; --h2:#8cc9a8; --h3:#4fa57c; --h4:#1f7a55;  /* heatmap: one hue, light -> dark */
  --shadow:0 1px 2px rgba(16,24,20,.04),0 4px 16px rgba(16,24,20,.05);
  --font:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1211; --surface:#171c1a; --ink:#e6ebe8; --ink-2:#b3bdb8; --muted:#86918c; --line:#29312d;
  --occupied:#2c9a70; --occupied-tint:#16281f; --away:#f5b979; --away-stripe:#d99a5a; --away-tint:#2c2218;
  --empty:#4a544f; --empty-tint:#1d2321; --alert:#ff8a80; --alert-tint:#3a1d1b;
  --h0:#202724; --h1:#1d4434; --h2:#24664a; --h3:#2c8a62; --h4:#4cc28d;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1211; --surface:#171c1a; --ink:#e6ebe8; --ink-2:#b3bdb8; --muted:#86918c; --line:#29312d;
  --occupied:#2c9a70; --occupied-tint:#16281f; --away:#f5b979; --away-stripe:#d99a5a; --away-tint:#2c2218;
  --empty:#4a544f; --empty-tint:#1d2321; --alert:#ff8a80; --alert-tint:#3a1d1b;
  --h0:#202724; --h1:#1d4434; --h2:#24664a; --h3:#2c8a62; --h4:#4cc28d;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 56px;display:grid;gap:20px}
.num{font-variant-numeric:tabular-nums}
.stack{display:grid;gap:20px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap}
.top-l{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand i{width:12px;height:12px;border-radius:3px;background:var(--occupied)}
.tabs{display:inline-flex;padding:3px;border-radius:10px;background:var(--line)}
.tabs button{font:inherit;font-size:14px;font-weight:500;border:0;background:none;color:var(--ink-2);padding:6px 14px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pills{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:7px}
.pill b{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok b{background:var(--occupied)} .pill.bad{color:var(--alert)} .pill.bad b{background:var(--alert)}
@media (prefers-reduced-motion:no-preference){.pill.ok.live b{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.35}}

.notify{font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}
.notify:hover{border-color:var(--ink-2)}
select{font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px;min-width:0}
.card h2{margin:0;font-size:15px;font-weight:600}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sub{font-size:13px;color:var(--muted)}

/* personal: hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}
.status{display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-height:230px;background:var(--tint,var(--surface))}
.status .seat{font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.status .state{display:flex;align-items:center;gap:12px;font-size:clamp(28px,4.4vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.status .state i{width:16px;height:16px;border-radius:50%;background:var(--c);flex:none}
.status .timer{font-size:clamp(44px,8vw,72px);font-weight:600;letter-spacing:-.03em;line-height:1}
.status .since{font-size:14px;color:var(--ink-2)}
.badge-alert{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:13px;font-weight:600;color:var(--alert);background:var(--alert-tint);padding:6px 12px;border-radius:999px}
.badge-study{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:13px;font-weight:600;color:var(--surface);background:var(--ink);padding:6px 12px;border-radius:999px}
.s-occupied{--c:var(--occupied);--tint:var(--occupied-tint)}
.s-away{--c:var(--away);--tint:var(--away-tint)}
.s-empty,.s-unknown{--c:var(--empty);--tint:var(--empty-tint)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tiles.four{grid-template-columns:repeat(4,1fr)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .k{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.tile .k i{width:8px;height:8px;border-radius:2px;background:var(--c,var(--muted))}
.tile .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile .v small{font-size:15px;font-weight:500;color:var(--ink-2);margin-left:2px}
.tile .d{font-size:12px;color:var(--muted)}

/* goal + streak */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px}
.goal{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .pct b{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1}
.ring .pct span{font-size:12px;color:var(--muted)}
.goal-txt{display:grid;gap:6px;font-size:14px;color:var(--ink-2)}
.goal-txt strong{color:var(--ink);font-size:18px}
.goal-edit{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.goal-edit input{width:56px;font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}

/* heatmap */
.heat-wrap{overflow-x:auto}
.heat-row{display:flex;gap:20px 36px;flex-wrap:wrap;align-items:flex-start}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,18px);grid-auto-columns:18px;gap:4px;width:max-content}
.heat i{border-radius:3px;background:var(--h0);cursor:default}
.heat i.l1{background:var(--h1)} .heat i.l2{background:var(--h2)} .heat i.l3{background:var(--h3)} .heat i.l4{background:var(--h4)}
.heat i.future{visibility:hidden}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.heat-legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:10px}
.heat-legend i{width:12px;height:12px;border-radius:3px}
.streak{display:grid;gap:12px;font-size:13px;color:var(--ink-2)}
.streak b{font-size:24px;color:var(--ink);margin-right:3px}

/* timeline */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.legend .s-away i,.seg.s-away,.seat-tile.s-away .bar-top{background:repeating-linear-gradient(135deg,var(--away) 0 6px,var(--away-stripe) 6px 9px)}
.bar{position:relative;height:56px;border-radius:10px;background:var(--bg);overflow:hidden}
.seg{position:absolute;top:0;bottom:0;background:var(--c);border:0;padding:0;cursor:pointer;box-shadow:inset -2px 0 0 var(--surface)}
.seg:hover,.seg:focus-visible{filter:brightness(1.08);outline:none}
.seg:focus-visible{box-shadow:inset 0 0 0 2px var(--ink)}
.axis{position:relative;height:22px;margin-top:6px;font-size:12px;color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--surface);font-size:13px;padding:8px 12px;border-radius:8px;line-height:1.45;white-space:nowrap;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}

/* feed */
.feed{list-style:none;margin:0;padding:0;display:grid}
.feed li{display:grid;grid-template-columns:64px 16px 1fr auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.feed time{color:var(--muted);font-size:13px}
.feed .dot{width:10px;height:10px;border-radius:50%;background:var(--c);justify-self:center}
.feed .what em{font-style:normal;color:var(--muted);margin:0 6px}
.feed .dur{color:var(--muted);font-size:13px;text-align:right}
.feed .s-alert{--c:var(--alert)} .feed .s-study{--c:var(--ink)}

/* library */
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.seat-tile{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--tint);padding:14px 12px 12px;display:grid;gap:2px;min-height:92px}
.seat-tile .bar-top{position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.seat-tile .id{font-size:13px;font-weight:600}
.seat-tile .st{font-size:12px;color:var(--ink-2)}
.seat-tile .el{font-size:13px;color:var(--ink-2)}
.seat-tile.alert{border-color:var(--alert);box-shadow:0 0 0 1px var(--alert) inset}
.seat-tile .warn{position:absolute;right:8px;top:10px;font-size:11px;font-weight:700;color:var(--alert)}
.seat-tile.mine{outline:2px dashed var(--ink-2);outline-offset:2px}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0}
.list .id{font-weight:600}
.list .why{color:var(--ink-2)}
.list .dur{font-weight:600;color:var(--alert)}
.list .dur.soft{color:var(--ink-2);font-weight:500}

.empty-state{text-align:center;padding:40px 16px;color:var(--ink-2)}
.empty-state h2{font-size:20px;margin:0 0 8px;color:var(--ink)}
.empty-state ol{display:inline-block;text-align:left;margin:12px 0 0;padding-left:20px;font-size:14px;line-height:1.9}
.empty-state code{background:var(--bg);padding:2px 6px;border-radius:4px;font-size:13px}
.empty-state a{color:var(--occupied)}
footer{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}

@media (max-width:860px){.hero,.split{grid-template-columns:1fr}.tiles.four{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.tile{padding:14px}.tile .v{font-size:22px}
  .feed li{grid-template-columns:52px 14px 1fr}.feed .dur{grid-column:3;text-align:left;margin-top:-6px}
  .goal{flex-direction:column;align-items:flex-start}}

/* badge mode: one seat, full screen (screen share / OBS) */
#badge{display:none}
body.badge .wrap{display:none}
body.badge #badge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:100vh;padding:24px;text-align:center;background:var(--tint,var(--bg))}
#badge .state{display:flex;align-items:center;gap:.3em;font-size:clamp(40px,10vw,120px);font-weight:700;letter-spacing:-.03em;line-height:1.1}
#badge .state i{width:.4em;height:.4em;border-radius:50%;background:var(--c)}
#badge .timer{font-size:clamp(28px,6vw,72px);font-weight:600;color:var(--ink-2)}
#badge .seat{font-size:clamp(13px,1.6vw,18px);color:var(--muted)}
#badge .warn{font-size:clamp(15px,2.2vw,24px);font-weight:600;color:var(--alert)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-l">
      <div class="brand"><i></i>Seat Monitor</div>
      <div class="tabs" role="tablist" aria-label="화면 모드">
        <button type="button" role="tab" data-mode="personal">개인</button>
        <button type="button" role="tab" data-mode="library">도서관</button>
      </div>
    </div>
    <div class="pills">
      <span class="pill" id="device"><b></b><span>기기 확인 중</span></span>
      <span class="pill live" id="live"><b></b><span>연결 중…</span></span>
      <button type="button" id="notifyBtn" class="notify" hidden>🔔 알림 켜기</button>
    </div>
  </header>
  <main id="main"></main>
  <footer>영상은 기기 밖으로 나가지 않습니다 · ESP32-S3에서 판정한 상태만 기록됩니다</footer>
</div>
<div id="badge"></div>
<div class="tip" id="tip" role="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Publishable key: insert/select only (RLS), safe to ship in a public page.
const SUPABASE_URL = "https://haivgsjhzpzzfctvtpht.supabase.co";
const SUPABASE_KEY = "sb_publishable__OgkuoZJ0eeN8WluGW_MnA_r-Uy7p2N";
const REFRESH_MS = 5000;
const HISTORY_DAYS = 84;        // 12 weeks for the heatmap
const ABSENCE_ALERT_MIN = 30;   // matches AWAY_ALERT_MS in firmware
const ONLINE_WITHIN_MS = 95000;   // heartbeat every 60 s, plus slack for a slow upload
const DAY = 86400000, HOUR = 3600000, MIN = 60000;

const LABEL = { occupied: "자리에 있음", away: "자리 비움", empty: "빈 자리", unknown: "확인 중" };
const params = new URLSearchParams(location.search);
const DEMO = params.has("demo");
const badgeSeat = params.get("badge");
let mode = params.get("mode") === "library" ? "library" : "personal";
let selected = params.get("seat");
let events = [];          // newest first
let beats = [];           // heartbeats, newest first
let lastOk = null, lastErr = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const clock = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 3600)}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; };
const hm = t => new Date(t).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Seoul" });
const kstDate = t => new Date(t).toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });
const dayStartOf = t => new Date(`${kstDate(t)}T00:00:00+09:00`).getTime();
const ms = ts => new Date(ts).getTime();
function human(d) {
  const m = Math.round(d / MIN);
  if (m < 1) return "1분 미만";
  return m >= 60 ? `${Math.floor(m / 60)}시간 ${m % 60}분` : `${m}분`;
}
function getGoalMin() { try { return +localStorage.getItem("goalMin") || 360; } catch { return 360; } }
function setGoalMin(v) { try { localStorage.setItem("goalMin", v); } catch {} }

/* ---------- data ---------- */
async function api(path) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: SUPABASE_KEY } });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function load() {
  if (DEMO) return demo();
  const since = new Date(Date.now() - HISTORY_DAYS * DAY).toISOString();
  const ev = await api(`seat_events?select=seat_id,ts,kind,from_state,to_state,duration_s,studied_s&ts=gte.${since}&order=ts.desc&limit=20000`);
  let hb = [];
  try { hb = await api("heartbeats?select=device_id,seat_id,ts,rssi,uptime_s,fw_version,queue&order=ts.desc&limit=100"); }
  catch { /* table not created yet: device status stays unknown */ }
  return { ev, hb };
}

// Time of the seat's last heartbeat if its device has gone quiet, else null.
// Without heartbeats (older data) the device is assumed alive.
function offlineSince(seat) {
  const b = beats.find(x => x.seat_id === seat);
  return b && Date.now() - ms(b.ts) > ONLINE_WITHIN_MS ? ms(b.ts) : null;
}

// State timeline of one seat: [{state, from, to}] from 'changed' events, oldest first.
// The last state lasts until now, or until the last heartbeat if the device is off.
function segments(seat) {
  const ch = events.filter(e => e.seat_id === seat && e.kind === "changed").reverse();
  const end = offlineSince(seat) ?? Date.now(), out = [];
  ch.forEach((e, i) => {
    if (e.to_state === "unknown") return;
    const from = ms(e.ts), to = i + 1 < ch.length ? ms(ch[i + 1].ts) : Math.max(from, end);
    out.push({ state: e.to_state, from, to });
  });
  return out;
}
const clip = (segs, a, b) => segs.filter(g => g.to > a && g.from < b).map(g => ({ ...g, from: Math.max(g.from, a), to: Math.min(g.to, b) }));
const total = (segs, st) => segs.filter(g => g.state === st).reduce((s, g) => s + g.to - g.from, 0);

function seatInfo(seat) {
  const segs = segments(seat);
  const cur = segs[segs.length - 1] || null;
  const state = cur ? cur.state : "unknown";
  // absence = time since the person last left (spans away <-> empty), like the firmware
  let absentSince = null;
  if (cur && state !== "occupied") {
    for (let i = segs.length - 1; i >= 0 && segs[i].state !== "occupied"; i--) absentSince = segs[i].from;
    if (!segs.some(g => g.state === "occupied")) absentSince = null;  // never occupied: just an empty seat
  }
  const lastAlert = events.find(e => e.seat_id === seat && e.kind === "away_too_long");
  const alert = absentSince !== null && lastAlert && ms(lastAlert.ts) >= absentSince;
  const study = events.find(e => e.seat_id === seat && (e.kind === "study_start" || e.kind === "study_stop"));
  const off = offlineSince(seat);
  return { seat, segs, state, since: cur ? cur.from : null, absentSince: off ? null : absentSince, alert: !off && alert,
           offline: off, studying: !off && study && study.kind === "study_start" ? ms(study.ts) : null };
}

/* ---------- demo data ---------- */
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function demo() {
  const now = Date.now(), r = rng(7), ev = [];
  const push = (seat, t, from, to, dur, kind = "changed") =>
    ev.push({ seat_id: seat, ts: new Date(t).toISOString(), kind, from_state: from, to_state: to, duration_s: Math.round(dur / 1000) });
  // desk-01: 12 weeks of study days
  for (let d = HISTORY_DAYS - 1; d >= 0; d--) {
    const day0 = dayStartOf(now - d * DAY);
    if (r() < 0.18 && d > 0) continue;  // rest days
    const short = r() < 0.3;  // some light days so the heatmap has range
    let t = day0 + (8 + r() * 2) * HOUR, prev = "empty", prevDur = 5 * MIN;
    push("desk-01", t - 5 * MIN, "unknown", "empty", 0);
    const end = d === 0 ? now - 25 * MIN : t + (short ? 1 + r() * 2 : 5 + r() * 6) * HOUR;
    while (t < end) {
      const sit = Math.min((35 + r() * 80) * MIN, end - t), gone = (5 + r() * (r() < 0.2 ? 50 : 15)) * MIN;
      push("desk-01", t, prev, "occupied", prevDur); t += sit;
      const st = t >= end ? "empty" : r() < 0.6 ? "away" : "empty";
      push("desk-01", t, "occupied", st, sit);
      if (t >= end) break;
      if (gone >= ABSENCE_ALERT_MIN * MIN) push("desk-01", t + ABSENCE_ALERT_MIN * MIN, st, st, ABSENCE_ALERT_MIN * MIN, "away_too_long");
      prev = st; prevDur = gone; t += gone;
    }
  }
  push("desk-01", now - 20 * MIN, "empty", "occupied", 5 * MIN);
  ev.push({ seat_id: "desk-01", ts: new Date(now - 18 * MIN).toISOString(), kind: "study_start", from_state: "occupied", to_state: "occupied", duration_s: 0 });
  // reading room A-01..A-24: current situation only
  for (let i = 1; i <= 24; i++) {
    const seat = `A-${pad(i)}`, x = r();
    const st = x < 0.55 ? "occupied" : x < 0.8 ? "away" : "empty";
    const sat = now - (60 + r() * 180) * MIN;
    push(seat, sat - 2 * MIN, "unknown", "empty", 0);
    push(seat, sat, "empty", "occupied", 0);
    if (st !== "occupied") {
      const left = now - (3 + r() * (r() < 0.5 ? 80 : 25)) * MIN;
      push(seat, left, "occupied", st, left - sat);
      if (now - left >= ABSENCE_ALERT_MIN * MIN) push(seat, left + ABSENCE_ALERT_MIN * MIN, st, st, ABSENCE_ALERT_MIN * MIN, "away_too_long");
    }
  }
  ev.sort((a, b) => b.ts.localeCompare(a.ts));
  return { ev, hb: [{ device_id: "xiao-01", seat_id: "desk-01", ts: new Date(now - 20000).toISOString(), rssi: -58, uptime_s: 15342, fw_version: "demo", queue: 0 }] };
}

/* ---------- personal view ---------- */
function personal() {
  const seats = [...new Set(events.map(e => e.seat_id))].sort();
  if (!seats.length) return emptyState();
  if (!seats.includes(selected)) selected = seats.includes("desk-01") ? "desk-01" : seats[0];
  const info = seatInfo(selected), now = Date.now(), t0 = dayStartOf(now);
  const today = clip(info.segs, t0, now);
  const sat = total(today, "occupied");
  const awayAll = today.filter(g => g.state !== "occupied" && g.from > t0);
  const absent = awayAll.reduce((s, g) => s + g.to - g.from, 0);
  const leaves = today.filter((g, i) => g.state !== "occupied" && i > 0 && today[i - 1].state === "occupied").length;
  const ratio = sat + absent > 0 ? Math.round(sat / (sat + absent) * 100) : 0;
  const studyToday = events.filter(e => e.seat_id === selected && e.kind === "study_stop" && ms(e.ts) >= t0);
  const studied = studyToday.reduce((s, e) => s + (e.studied_s || 0) * 1000, 0);
  const picker = seats.length > 1
    ? `<select id="seatPick" aria-label="좌석 선택">${seats.map(s => `<option ${s === selected ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>` : "";

  return `<div class="stack">
    <section class="hero">
      <article class="card status s-${info.offline ? "unknown" : info.state}" aria-live="polite">
        <div class="seat"><span>${esc(selected)}</span>${picker}</div>
        ${info.offline ? `<div>
          <div class="state"><i></i>기기 꺼짐</div>
          <div class="since" style="margin-top:10px">마지막 상태: ${LABEL[info.state]} · ${hm(info.offline)} 이후 신호 없음</div>
        </div>` : `<div>
          <div class="state"><i></i>${LABEL[info.state]}</div>
          <div class="timer num" data-since="${info.since ?? ""}" data-fmt="clock">${info.since ? clock(now - info.since) : "–"}</div>
        </div>`}
        <div style="display:flex;flex-direction:column;gap:8px">
          ${info.studying ? `<span class="badge-study">✋ 공부 타이머 <span class="num" data-since="${info.studying}" data-fmt="clock"></span></span>` : ""}
          ${info.alert ? `<span class="badge-alert">⚠ ${ABSENCE_ALERT_MIN}분 넘게 자리 비움</span>` : ""}
          <span class="since">${info.since && !info.offline ? `${hm(info.since)}부터` : ""}</span>
        </div>
      </article>
      <div class="tiles">
        ${tile("오늘 앉아 있던 시간", human(sat), "자리 비운 시간 제외", "s-occupied")}
        ${tile("자리 비운 시간", human(absent), `${leaves}번 자리를 떠남`, "s-away")}
        ${tile("집중 유지율", `${ratio}<small>%</small>`, "앉음 ÷ (앉음 + 자리 비움)")}
        ${studyToday.length ? tile("타이머 순공 시간", human(studied), `세션 ${studyToday.length}회`) : tile("가장 오래 앉은 시간", human(Math.max(0, ...today.filter(g => g.state === "occupied").map(g => g.to - g.from))), "한 번에 연속으로")}
      </div>
    </section>
    <section class="split">
      ${goalCard(sat)}
      ${heatCard(info.segs)}
    </section>
    <section class="card">
      <div class="card-head"><h2>오늘의 자리 기록</h2>${legend()}</div>
      ${timeline(today)}
    </section>
    <section class="card"><div class="card-head"><h2>최근 기록</h2></div>${feed(selected)}</section>
  </div>`;
}

const tile = (k, v, d, cls = "") =>
  `<div class="tile ${cls}"><span class="k">${cls ? "<i></i>" : ""}${k}</span><span class="v num">${v}</span><span class="d">${d}</span></div>`;
const legend = () => `<div class="legend"><span class="s-occupied"><i></i>자리에 있음</span><span class="s-away"><i></i>자리 비움 (짐 있음)</span><span class="s-empty"><i></i>빈 자리</span></div>`;

function goalCard(sat) {
  const goal = getGoalMin() * MIN, p = Math.min(1, sat / goal), R = 56, C = 2 * Math.PI * R;
  return `<article class="card">
    <div class="card-head"><h2>오늘 목표</h2></div>
    <div class="goal">
      <div class="ring" role="img" aria-label="목표 ${Math.round(p * 100)}% 달성">
        <svg width="132" height="132" viewBox="0 0 132 132">
          <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/>
          <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--occupied)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${(C * p).toFixed(1)} ${C.toFixed(1)}"/>
        </svg>
        <div class="pct"><b class="num">${Math.round(p * 100)}%</b><span>달성</span></div>
      </div>
      <div class="goal-txt">
        <strong class="num">${human(sat)}</strong>
        <span>목표 ${human(goal)} 중${p >= 1 ? " · 목표 달성!" : ` · ${human(goal - sat)} 남음`}</span>
        <label class="goal-edit">목표 <input id="goalIn" type="number" min="0.5" max="16" step="0.5" value="${getGoalMin() / 60}"> 시간</label>
      </div>
    </div>
  </article>`;
}

function heatCard(segs) {
  const now = Date.now(), goal = getGoalMin() * MIN, today0 = dayStartOf(now);
  const todayDow = new Date(today0 + 9 * HOUR).getUTCDay();  // KST weekday, 0 = Sun
  const first = today0 - (HISTORY_DAYS - 7 + todayDow) * DAY;  // a Sunday, so columns are weeks
  const cells = [], perDay = [];
  for (let t = first; t <= today0 + (6 - todayDow) * DAY; t += DAY) {
    if (t > today0) { cells.push('<i class="future"></i>'); continue; }
    const v = total(clip(segs, t, Math.min(t + DAY, now)), "occupied");
    perDay.push({ t, v });
    const lv = v <= 0 ? 0 : v < goal * .25 ? 1 : v < goal * .5 ? 2 : v < goal ? 3 : 4;
    cells.push(`<i class="l${lv}${t === today0 ? " today" : ""}" data-tip="${kstDate(t)} · ${v ? human(v) : "기록 없음"}"></i>`);
  }
  // streak of goal-met days, ending today (or yesterday if today is still in progress)
  let streak = 0;
  for (let i = perDay.length - 1; i >= 0; i--) {
    if (perDay[i].v >= goal) streak++;
    else if (i === perDay.length - 1) continue;
    else break;
  }
  const week = perDay.slice(-7).reduce((s, d) => s + d.v, 0);
  const active = perDay.filter(d => d.v > 0);
  return `<article class="card">
    <div class="card-head"><h2>공부 잔디</h2><span class="sub">최근 12주 · 하루 앉아 있던 시간</span></div>
    <div class="heat-row">
    <div>
      <div class="heat-wrap"><div class="heat">${cells.join("")}</div></div>
      <div class="heat-legend">적음 <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> 목표 달성</div>
    </div>
    <div class="streak">
      <span><b class="num">${streak}</b>일 연속 목표 달성</span>
      <span>최근 7일 <b class="num">${(week / HOUR).toFixed(1)}</b>시간</span>
      <span>하루 평균 <b class="num">${active.length ? (active.reduce((s, d) => s + d.v, 0) / active.length / HOUR).toFixed(1) : 0}</b>시간</span>
    </div>
    </div>
  </article>`;
}

let tipSegs = [];
function timeline(segs) {
  if (!segs.length) return '<p class="sub" style="margin:0">오늘 기록이 아직 없습니다.</p>';
  const now = Date.now();
  // start an hour before the seat was first used today, not at midnight
  const firstUse = segs.find(g => g.state !== "empty") || segs[0];
  let from = Math.max(Math.floor(segs[0].from / HOUR) * HOUR, Math.floor(firstUse.from / HOUR) * HOUR - HOUR);
  let to = Math.ceil(now / HOUR) * HOUR;
  if (to - from < 2 * HOUR) from = to - 2 * HOUR;
  const span = to - from, pct = t => ((t - from) / span * 100).toFixed(3);
  tipSegs = segs;
  segs = clip(segs, from, to);
  tipSegs = segs;
  const bars = segs.map((g, i) => `<button type="button" class="seg s-${g.state}" data-seg="${i}"
      style="left:${pct(g.from)}%;width:${(Math.max(g.to - g.from, span / 400) / span * 100).toFixed(3)}%"
      aria-label="${LABEL[g.state]} ${hm(g.from)}–${hm(g.to)}, ${human(g.to - g.from)}"></button>`).join("");
  const step = span > 12 * HOUR ? 3 * HOUR : span > 6 * HOUR ? 2 * HOUR : HOUR;
  let ticks = "";
  for (let t = from; t <= to; t += step) ticks += `<span style="left:${pct(t)}%">${hm(t)}</span>`;
  return `<div class="bar">${bars}</div><div class="axis num">${ticks}</div>`;
}

function feed(seat) {
  const list = events.filter(e => e.seat_id === seat).slice(0, 12);
  if (!list.length) return '<p class="sub" style="margin:0">기록 없음</p>';
  return `<ul class="feed">${list.map(e => {
    const t = hm(e.ts), dur = e.duration_s * 1000;
    if (e.kind === "away_too_long") return `<li class="s-alert"><time class="num">${t}</time><span class="dot"></span>
      <span>장시간 자리 비움 ${e.to_state === "away" ? "(짐 있음)" : "(짐 안 보임)"}</span><span class="dur">${human(dur)}째</span></li>`;
    if (e.kind === "study_start") return `<li class="s-study"><time class="num">${t}</time><span class="dot"></span><span>✋ 공부 시작</span><span class="dur">손바닥</span></li>`;
    if (e.kind === "study_stop") return `<li class="s-study"><time class="num">${t}</time><span class="dot"></span><span>✊ 공부 종료</span><span class="dur">순공 ${human((e.studied_s || 0) * 1000)}</span></li>`;
    return `<li class="s-${esc(e.to_state)}"><time class="num">${t}</time><span class="dot"></span>
      <span><span class="sub">${LABEL[e.from_state] || esc(e.from_state)}</span><em>→</em>${LABEL[e.to_state] || esc(e.to_state)}</span>
      <span class="dur">${e.from_state === "unknown" ? "시작" : `${human(dur)} 머문 뒤`}</span></li>`;
  }).join("")}</ul>`;
}

/* ---------- library view ---------- */
function library() {
  const seats = [...new Set(events.map(e => e.seat_id))].sort();
  if (!seats.length) return emptyState();
  const now = Date.now(), infos = seats.map(seatInfo);
  const n = st => infos.filter(i => !i.offline && i.state === st).length;
  const occ = n("occupied"), away = n("away"), empty = n("empty") + n("unknown");
  const held = occ + away;
  const absent = infos.filter(i => i.absentSince !== null).sort((a, b) => a.absentSince - b.absentSince);
  return `<div class="stack">
    <section class="tiles four">
      ${tile("사용 중", `${occ}<small>석</small>`, `전체 ${seats.length}석`, "s-occupied")}
      ${tile("짐만 있고 비움", `${away}<small>석</small>`, "자리 맡기 의심", "s-away")}
      ${tile("빈 자리", `${empty}<small>석</small>`, "지금 앉을 수 있음", "s-empty")}
      ${tile("실제 이용률", `${held ? Math.round(occ / held * 100) : 0}<small>%</small>`, "점유된 좌석 중 사람이 있는 비율")}
    </section>
    <section class="card">
      <div class="card-head"><h2>열람실 좌석</h2>${legend()}</div>
      <div class="seats">${infos.map(i => `
        <div class="seat-tile s-${i.offline ? "unknown" : i.state}${i.alert ? " alert" : ""}${i.seat === "desk-01" ? " mine" : ""}" title="${esc(i.seat)} · ${i.offline ? "기기 꺼짐" : LABEL[i.state]}">
          <span class="bar-top"></span>${i.alert ? '<span class="warn">⚠ 장시간</span>' : ""}
          <span class="id">${esc(i.seat)}</span>
          <span class="st">${i.offline ? "기기 꺼짐" : LABEL[i.state]}</span>
          <span class="el num" ${i.offline ? "" : `data-since="${i.absentSince ?? i.since ?? ""}" data-fmt="human"`}></span>
        </div>`).join("")}</div>
    </section>
    <section class="card">
      <div class="card-head"><h2>자리 비움 좌석</h2><span class="sub">오래 비운 순 · ${ABSENCE_ALERT_MIN}분 넘으면 반납 대상</span></div>
      ${absent.length ? `<ul class="list">${absent.map(i => `
        <li><span class="id">${esc(i.seat)}</span>
          <span class="why">${i.state === "away" ? "짐만 두고 자리 비움" : "짐 없이 떠남 (퇴실 미처리)"}</span>
          <span class="dur num${now - i.absentSince < ABSENCE_ALERT_MIN * MIN ? " soft" : ""}" data-since="${i.absentSince}" data-fmt="human"></span></li>`).join("")}</ul>`
        : '<p class="sub" style="margin:0">자리를 비운 좌석이 없습니다.</p>'}
    </section>
  </div>`;
}

function emptyState() {
  return `<section class="card empty-state">
    <h2>아직 기록이 없습니다</h2>
    <p>ESP32가 상태를 보내면 여기에 실시간으로 나타납니다. <a href="?demo">예시 데이터로 보기</a></p>
    <ol>
      <li>ESP32에 전원이 들어가 있고 Wi-Fi(2.4GHz)에 연결되어 있는지</li>
      <li>Supabase에서 <code>supabase/schema.sql</code>을 실행했는지 (읽기 정책 포함)</li>
    </ol>
  </section>`;
}

/* ---------- badge ---------- */
function badge() {
  const i = seatInfo(badgeSeat);
  document.body.className = `badge s-${i.offline ? "unknown" : i.state}`;
  $("badge").innerHTML = `<div class="state"><i></i>${i.offline ? "기기 꺼짐" : LABEL[i.state]}</div>
    <div class="timer num" ${i.offline ? "" : `data-since="${i.since ?? ""}" data-fmt="clock"`}></div>
    ${i.alert ? '<div class="warn">장시간 자리 비움</div>' : ""}
    <div class="seat">${esc(badgeSeat)}</div>`;
}

/* ---------- render ---------- */
function render() {
  if (badgeSeat) { badge(); tick(); return; }
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.mode === mode));
  $("main").innerHTML = mode === "library" ? library() : personal();
  tick();
}

function tick() {
  const now = Date.now();
  document.querySelectorAll("[data-since]").forEach(el => {
    const s = +el.dataset.since;
    if (!s) return;
    el.textContent = el.dataset.fmt === "clock" ? clock(now - s) : `${human(now - s)}째`;
  });
  const live = $("live");
  live.className = `pill live ${lastErr ? "bad" : lastOk ? "ok" : ""}`;
  live.lastElementChild.textContent = lastErr ? `서버 연결 실패 (${lastErr})`
    : lastOk ? (DEMO ? "예시 데이터" : realtime ? "실시간 연결됨" : `${Math.round((now - lastOk) / 1000)}초 전 갱신`) : "연결 중…";
  const dev = $("device"), b = beats[0];
  if (!b) { dev.className = "pill"; dev.lastElementChild.textContent = "기기 상태 정보 없음"; }
  else {
    const age = now - ms(b.ts), on = age < ONLINE_WITHIN_MS;
    dev.className = `pill ${on ? "ok" : "bad"}`;
    dev.lastElementChild.textContent = on ? `ESP32 연결됨 · Wi-Fi ${b.rssi}dBm` : `ESP32 오프라인 · ${human(age)} 전 마지막 신호`;
    dev.title = `${b.device_id} · 펌웨어 ${b.fw_version} · 가동 ${human(b.uptime_s * 1000)}`;
  }
}

async function refresh() {
  try { const d = await load(); events = d.ev; beats = d.hb; lastOk = Date.now(); lastErr = null; notifyNew(); render(); }
  catch (err) { lastErr = err.message; tick(); }
}

/* ---------- live updates: Supabase Realtime, polling as fallback ---------- */
let realtime = false;
if (!DEMO && window.supabase) {
  window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    .channel("seat-events")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "seat_events" }, () => refresh())
    .subscribe(status => { realtime = status === "SUBSCRIBED"; tick(); });
}
// With Realtime the poll only refreshes heartbeats (device online/offline).
(function poll() { setTimeout(async () => { await refresh(); poll(); }, realtime ? 30000 : REFRESH_MS); })();

/* ---------- browser notifications for long absences ---------- */
const notified = new Set();
let notifyPrimed = false;  // events present at first load are history, not news
function notifyNew() {
  const fresh = events.filter(e => e.kind === "away_too_long" && !notified.has(e.seat_id + e.ts));
  fresh.forEach(e => notified.add(e.seat_id + e.ts));
  if (!notifyPrimed) { notifyPrimed = true; return; }
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  for (const e of fresh) {
    if (mode === "personal" && e.seat_id !== selected) continue;
    new Notification(`${e.seat_id} · ${ABSENCE_ALERT_MIN}분 넘게 자리 비움`, {
      body: e.to_state === "away" ? "짐만 두고 자리를 비웠습니다." : "짐 없이 자리를 떠났습니다 (퇴실 미처리).",
      tag: e.seat_id,
    });
  }
}
const notifyBtn = $("notifyBtn");
if ("Notification" in window && Notification.permission === "default" && !badgeSeat) {
  notifyBtn.hidden = false;
  notifyBtn.onclick = async () => { await Notification.requestPermission(); notifyBtn.hidden = true; };
}

/* ---------- interaction ---------- */
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-mode]");
  if (!b) return;
  mode = b.dataset.mode;
  params.set("mode", mode);
  history.replaceState(null, "", `?${params}`);
  render();
});
document.addEventListener("change", e => {
  if (e.target.id === "seatPick") { selected = e.target.value; params.set("seat", selected); history.replaceState(null, "", `?${params}`); render(); }
  if (e.target.id === "goalIn" && +e.target.value > 0) { setGoalMin(Math.round(+e.target.value * 60)); render(); }
});

const tip = $("tip");
function showTip(html, x, y) {
  tip.innerHTML = html;
  tip.style.left = Math.max(8, Math.min(x + 12, innerWidth - tip.offsetWidth - 8)) + "px";
  tip.style.top = Math.max(8, y - tip.offsetHeight - 12) + "px";
  tip.classList.add("on");
}
function tipFor(el) {
  if (el.dataset.seg !== undefined) {
    const g = tipSegs[el.dataset.seg];
    return g && `<b>${LABEL[g.state]}</b><br>${hm(g.from)} – ${hm(g.to)} · ${human(g.to - g.from)}`;
  }
  return el.dataset.tip && esc(el.dataset.tip);
}
document.addEventListener("pointermove", e => {
  const el = e.target.closest("[data-seg],[data-tip]");
  const html = el && tipFor(el);
  html ? showTip(html, e.clientX, e.clientY) : tip.classList.remove("on");
});
document.addEventListener("focusin", e => {
  const el = e.target.closest("[data-seg]");
  if (!el) return tip.classList.remove("on");
  const r = el.getBoundingClientRect();
  showTip(tipFor(el), r.left + r.width / 2, r.top);
});

refresh();
setInterval(tick, 1000);
</script>
</body>
</html>
