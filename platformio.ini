[platformio]
default_envs = xiao

; Seeed XIAO ESP32S3 Sense firmware
[env:xiao]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  spaziochirale/Chirale_TensorFLowLite@2.0.0

; Host-side unit tests for the seat logic (lib/seat), run in CI
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
